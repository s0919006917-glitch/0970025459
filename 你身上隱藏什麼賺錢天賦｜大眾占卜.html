<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>你身上隱藏什麼賺錢天賦｜大眾占卜</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#4b3a8a;background:linear-gradient(160deg,#dcd0f5 0%,#efe3f7 55%,#f8e1ec 100%);background-attachment:fixed;text-align:center;overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:36px 18px 48px}
.pill{display:inline-block;background:rgba(255,255,255,.65);color:#4b3a8a;font-weight:900;font-size:22px;letter-spacing:.18em;padding:10px 34px;border-radius:999px}
h1{margin:34px 0 8px;font-weight:900;font-size:clamp(30px,8.4vw,44px);line-height:1.25;color:#c71fc7;text-shadow:0 4px 12px rgba(199,31,199,.28)}
.sub{font-size:16px;color:#6d5aa8;margin:0 0 6px}
.div{display:flex;align-items:center;gap:14px;margin:22px 0;color:#fff;font-size:26px}
.div:before,.div:after{content:"";flex:1;height:3px;background:#fff;border-radius:2px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pick{background:none;border:0;padding:0;font:inherit;cursor:pointer;transition:transform .5s,opacity .5s,filter .5s;animation:float 3.6s ease-in-out infinite}
.pick:nth-child(2){animation-delay:.6s}.pick:nth-child(3){animation-delay:1.2s}
.pick .img{display:block;aspect-ratio:270/368;border-radius:18px;border:4px solid #fff;overflow:hidden;box-shadow:0 8px 24px rgba(120,80,200,.3);transition:box-shadow .3s}
.pick img{width:100%;height:100%;object-fit:cover;display:block}
.pick .l{display:block;margin-top:10px;font-size:46px;font-weight:900;color:#a58af0;text-shadow:2px 2px 0 #fff;line-height:1}
.pick:hover .img,.pick:focus-visible .img{box-shadow:0 0 0 3px #f5c75a,0 12px 30px rgba(245,199,90,.7)}
.pick:hover{transform:translateY(-8px) scale(1.04)}
@keyframes float{50%{transform:translateY(-7px)}}
.cards.done .pick{animation:none;pointer-events:none;opacity:0;filter:blur(3px);transform:scale(.85)}
.cards.done .pick.sel{opacity:1;filter:none;transform:scale(1.06)}
.cards.done .pick.sel .img{box-shadow:0 0 0 4px #f5c75a,0 0 40px rgba(245,199,90,.9)}
.cards.done{grid-template-columns:1fr;justify-items:center}
.cards.done .pick:not(.sel){display:none}
.cards.done .pick.sel{width:46%;max-width:200px}
.hint{margin:18px 0 0;color:#6d5aa8;font-size:15px}
#result{display:none;margin-top:22px;background:rgba(255,255,255,.78);border-radius:24px;padding:26px 22px;box-shadow:0 10px 30px rgba(120,80,200,.18);animation:rise .9s ease both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
#result .opt{font-weight:900;color:#a58af0;font-size:18px;letter-spacing:.1em}
#result h2{margin:6px 0 14px;color:#c71fc7;font-size:28px;font-weight:900}
#result p{margin:0;text-align:left;line-height:1.95;font-size:16.5px;color:#3d3170}
.line{display:block;margin-top:24px;background:#06c755;color:#fff;text-decoration:none;font-weight:900;font-size:19px;padding:16px;border-radius:999px;box-shadow:0 8px 20px rgba(6,199,85,.35);transition:transform .2s}
.line:hover{transform:translateY(-2px)}
.cta{margin:10px 0 0;font-size:13.5px;color:#7a69b0}
.again{margin-top:14px;background:none;border:0;color:#8a74d4;font:inherit;font-size:14px;text-decoration:underline;cursor:pointer}
.spark{position:fixed;pointer-events:none;width:8px;height:8px;border-radius:50%;background:#f5c75a;box-shadow:0 0 10px #f5c75a;animation:sp 1.1s ease-out forwards}
@keyframes sp{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>
