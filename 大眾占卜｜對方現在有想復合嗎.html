<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大眾占卜｜對方現在有想復合嗎</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#dccff3;--bg2:#ebdff7;--bg3:#f8dde9;--ink:#4b3a8f;--accent:#8b6fdc;--pill:rgba(255,255,255,.55);--card:rgba(255,255,255,.75);--text:#4a3f6b;--line:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a2147;--bg2:#3a2c5e;--bg3:#4d2f55;--ink:#d9ccff;--accent:#b49cff;--pill:rgba(255,255,255,.12);--card:rgba(255,255,255,.1);--text:#e9e2ff;--line:rgba(255,255,255,.5)}}
:root[data-theme="dark"]{--bg1:#2a2147;--bg2:#3a2c5e;--bg3:#4d2f55;--ink:#d9ccff;--accent:#b49cff;--pill:rgba(255,255,255,.12);--card:rgba(255,255,255,.1);--text:#e9e2ff;--line:rgba(255,255,255,.5)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2) 50%,var(--bg3));color:var(--text);display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:36px 18px 48px;text-align:center}
.pill{display:inline-block;background:var(--pill);color:var(--ink);font-weight:900;font-size:20px;letter-spacing:4px;padding:10px 30px;border-radius:999px}
h1{margin:34px 0 10px;font-size:clamp(30px,9vw,46px);font-weight:900;color:#fff;line-height:1.25;text-shadow:0 4px 14px rgba(120,90,190,.35)}
.sub{margin:0 0 6px;font-size:15px;opacity:.85}
.divider{display:flex;align-items:center;gap:14px;margin:22px 0;color:#fff}
.divider::before,.divider::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.divider span{font-size:26px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pick{background:none;border:0;padding:0;cursor:pointer;font-family:inherit;transition:transform .5s,opacity .5s;animation:float 3.4s ease-in-out infinite}
.pick:nth-child(2){animation-delay:.4s}.pick:nth-child(3){animation-delay:.8s}
@keyframes float{50%{transform:translateY(-8px)}}
.pick:hover .frame{transform:scale(1.04) rotate(-1deg)}
.frame{display:block;filter:drop-shadow(0 10px 18px rgba(139,111,220,.3));transition:transform .3s}
.frame img{width:100%;height:auto;display:block}
.letter{display:block;margin-top:12px;font-size:44px;font-weight:900;color:var(--accent);text-shadow:2px 2px 0 #fff}
.chosen{animation:none;transform:scale(1.12)}
.dim{opacity:.25;transform:scale(.88);pointer-events:none;animation:none}
.cards.done .pick{pointer-events:none}
.hint{font-size:14px;opacity:.75;margin-top:18px}
#result{display:none;margin-top:30px;background:var(--card);border-radius:26px;padding:28px 22px;box-shadow:0 12px 32px rgba(139,111,220,.22);text-align:left;animation:rise .8s both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
#result h2{margin:0 0 14px;text-align:center;color:var(--ink);font-size:26px;font-weight:900}
#result p{margin:0;line-height:1.95;font-size:16px}
.meter{margin:24px 0 4px}
.meter b{display:flex;justify-content:space-between;color:var(--ink);font-size:15px;margin-bottom:8px}
.bar{height:14px;background:rgba(139,111,220,.18);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b49cff,#f5a5c8);border-radius:99px;transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.cta{display:block;margin-top:26px;text-align:center;text-decoration:none;background:#06c755;color:#fff;font-weight:900;font-size:19px;padding:16px;border-radius:999px;box-shadow:0 8px 20px rgba(6,199,85,.35);animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.again{display:block;margin:18px auto 0;background:none;border:2px solid var(--accent);color:var(--accent);font-family:inherit;font-weight:700;font-size:16px;padding:10px 26px;border-radius:999px;cursor:pointer}
.again:hover{background:var(--accent);color:#fff}
.cta-note{text-align:center;font-size:13px;opacity:.75;margin-top:10px}
</style>
</head>
