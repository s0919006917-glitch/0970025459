<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大眾占卜｜你目前適合穩定工作還是發展副業</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>
:root{--bg1:#0d1a3d;--bg2:#050a1f;--gold:#e8c77a;--pill:#e9c9f0;--pillText:#8a3a52;--letter:#6c5ce7;--text:#fff;--panel:rgba(8,12,36,.72);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[data-theme="purple"]{--bg1:#2a1457;--bg2:#0e0626;--gold:#f0c8ff}
html[data-theme="black"]{--bg1:#1a1a1f;--bg2:#000;--gold:#d9c28a}
html[data-theme="wine"]{--bg1:#4a1426;--bg2:#12040a;--gold:#f2cf8e}
html[data-theme="teal"]{--bg1:#0c3b45;--bg2:#031319;--gold:#bfeee6}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--text);font-family:"Noto Serif TC","PMingLiU","Songti TC",serif;
 background:radial-gradient(ellipse at 50% 20%,var(--bg1),var(--bg2) 75%) fixed;overflow-x:hidden;transition:background .6s}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.moon{position:fixed;width:90px;height:90px;border-radius:50%;box-shadow:inset -14px 0 0 0 var(--gold);opacity:.7;z-index:0;pointer-events:none}
.m1{left:-18px;top:26%;transform:rotate(-20deg);width:70px;height:70px}
.m2{right:-30px;top:-20px;box-shadow:inset 12px 0 0 0 var(--gold);width:120px;height:120px}
.ring{position:fixed;border:1px solid var(--gold);border-radius:50%;opacity:.25;z-index:0;pointer-events:none}
.r1{width:520px;height:520px;left:-260px;bottom:-200px}.r2{width:380px;height:380px;right:-190px;top:-120px}
.themes{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:10;display:flex;gap:7px;background:rgba(0,0,0,.35);padding:7px 9px;border-radius:20px;backdrop-filter:blur(6px)}
.themes button{width:20px;height:20px;border-radius:50%;border:2px solid #fff8;cursor:pointer;padding:0}
.themes button.on{border-color:#fff;transform:scale(1.15)}
main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:44px 18px 40px;text-align:center}
.pill{display:inline-block;background:var(--pill);color:var(--pillText);font-weight:900;font-size:clamp(26px,7vw,40px);letter-spacing:.12em;padding:10px 40px;border-radius:30px}
h1{font-size:clamp(26px,7.4vw,46px);line-height:1.45;margin:26px 0 30px;font-weight:900;text-shadow:0 2px 12px #0008}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,3vw,26px)}
.card{cursor:pointer;background:none;border:0;padding:0;color:inherit;font:inherit;animation:fl 4s ease-in-out infinite;transition:transform .6s,opacity .6s,filter .6s}
.card:nth-child(2){animation-delay:.6s}.card:nth-child(3){animation-delay:1.2s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.frame{padding:6px;border-radius:22px;background:rgba(255,255,255,.12);box-shadow:0 0 24px rgba(160,150,255,.35);transition:box-shadow .4s}
.frame img{display:block;width:100%;aspect-ratio:266/362;object-fit:cover;border-radius:16px;border:3px solid #fff}
.card:hover .frame{box-shadow:0 0 34px var(--gold)}
.letter{display:block;margin-top:14px;font-size:clamp(36px,10vw,58px);font-weight:900;color:var(--letter);text-shadow:0 0 14px #8e7dff88}
.cards.shuffle .card{animation:sh .25s linear 4}
@keyframes sh{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) translateY(-6px)}75%{transform:rotate(4deg) translateY(-6px)}}
.cards.done .card{animation:none;pointer-events:none}
.cards.done .card:not(.picked){opacity:.18;filter:grayscale(.8);transform:scale(.88)}
.cards.done .card.picked{transform:scale(1.06)}
.cards.done .card.picked .frame{box-shadow:0 0 44px var(--gold)}
.prompt{margin:34px 0 0;font-size:clamp(21px,5.6vw,34px);font-weight:900;text-shadow:0 2px 12px #0008}
.brand{margin:38px 0 0;font-size:clamp(24px,6.5vw,38px);font-weight:900;letter-spacing:.1em}
#answer{display:none;margin-top:30px;text-align:left;background:var(--panel);border:1px solid var(--gold);border-radius:22px;padding:28px 24px;box-shadow:0 0 40px rgba(0,0,0,.4);backdrop-filter:blur(6px)}
#answer.show{display:block;animation:up .9s ease both}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#answer h2{margin:0 0 14px;color:var(--gold);font-size:clamp(22px,6vw,30px);text-align:center}
#answer p{margin:0;line-height:2;font-size:clamp(16px,4.3vw,19px);font-weight:500}
.line{display:block;margin:26px auto 0;max-width:340px;text-align:center;text-decoration:none;background:#06c755;color:#fff;font-weight:900;font-size:clamp(18px,5vw,22px);padding:15px 20px;border-radius:40px;box-shadow:0 6px 22px rgba(6,199,85,.45);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.again{display:block;margin:16px auto 0;background:none;border:0;color:var(--gold);opacity:.8;cursor:pointer;font:inherit;font-size:14px;text-decoration:underline}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

  title:  "你目前適合穩定工作<br>還是發展副業",
  prompt: "請憑直覺選出一張有感應的牌",
  lineUrl:  "https://page.line.me/232bdfwv",
  lineText: "我要預約占卜",
  answers: {
    A: { title: "✨選項A", text: "你目前可能已經對目前的工作有所倦怠或者感覺到停滯不前的狀態，希望可以透過副業尋找新的發展機會以證明自己的價值，但是現在的你，在副業收入結構跟長期穩定性比較起來還需要花點時間去建立，建議先保留穩定收入，同時可以慢慢計劃經營自己的副業，確保副業有穩定收入後與獲利後再評估是否求換跑道。" },
    B: { title: "✨選項B", text: "現階段可能因為受到情緒或者環境影響急於切換跑道或發展副業，但目前比較需要做的是重新審視生活，調整自己的步調，以免方向不穩而影響發展結果，現在比較建議你須先想好規劃方向目標，透過市場調查之後讓自己的行動目標與實際調查結果符合一致後再行動，同時也要注意資源分配，以及對未來發展上的期待影響。" },
    C: { title: "✨選項C", text: "你目前可能已經有新的目標跟機會出現了，也在等待時機開始準備進行，也對於目前的工作環境有了不再停在舒適圈，願意為了新的工作挑戰看看，建議如果目前的副業多少已經讓你具備客源了，可以開始評估看看這條路是否能夠增加時間去投入，利用現有資源及工作去支撐你的新副業" }

};

const $=id=>document.getElementById(id);
$("tag").textContent=CONFIG.tag; $("title").innerHTML=CONFIG.title; $("prompt").textContent=CONFIG.prompt; $("brand").textContent=CONFIG.brand;
const line=$("line"); line.href=CONFIG.lineUrl; line.textContent=CONFIG.lineText;
// stars
const st=$("stars");for(let i=0;i<90;i++){const s=document.createElement("i");s.className="star";const z=Math.random()*2.2+.6;
 s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;st.appendChild(s)}
// themes
const th=$("themes");
function setTheme(k){document.documentElement.dataset.theme=k;[...th.children].forEach(b=>b.classList.toggle("on",b.dataset.k===k));try{localStorage.setItem("th",k)}catch(e){}}
CONFIG.themes.forEach(([k,n,c])=>{const b=document.createElement("button");b.dataset.k=k;b.title=n;b.style.background=c;b.onclick=()=>setTheme(k);th.appendChild(b)});
let saved="navy";try{saved=localStorage.getItem("th")||"navy"}catch(e){} setTheme(saved);
// cards
const cards=$("cards"),ans=$("answer");
cards.querySelectorAll(".card").forEach(c=>c.onclick=()=>{
  cards.classList.add("shuffle");
  setTimeout(()=>{
    cards.classList.remove("shuffle");cards.classList.add("done");c.classList.add("picked");
    const a=CONFIG.answers[c.dataset.k];$("aTitle").textContent=a.title;$("aText").textContent=a.text;
    ans.classList.add("show");setTimeout(()=>ans.scrollIntoView({behavior:"smooth",block:"center"}),150);
  },1000);
});
$("again").onclick=()=>{ans.classList.remove("show");cards.classList.remove("done");cards.querySelectorAll(".card").forEach(c=>c.classList.remove("picked"));window.scrollTo({top:0,behavior:"smooth"})};
